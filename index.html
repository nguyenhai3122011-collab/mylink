<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Links — Tổng hợp tool, web flash...</title>
<meta name="description" content="Tất cả website, dự án và liên kết của tôi ở một nơi.">
<meta property="og:title" content="Links — Tổng hợp website của tôi">
<meta property="og:description" content="Tất cả website, dự án và liên kết của tôi ở một nơi.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
<style>
:root{
  --bg:#0a0c12;
  --panel:rgba(255,255,255,.045);
  --panel-2:rgba(255,255,255,.065);
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.16);
  --text:#eef1f8;
  --muted:#959fb4;
  --accent:#7c5cff;
  --accent2:#22d3ee;
  --accent-soft:rgba(124,92,255,.18);
  --shadow:0 22px 60px rgba(0,0,0,.38);
  --radius:20px;
  --ok:#34d399;
}
html[data-theme="light"]{
  --bg:#f4f6fc;
  --panel:rgba(255,255,255,.78);
  --panel-2:rgba(255,255,255,.95);
  --border:rgba(18,24,45,.10);
  --border-strong:rgba(18,24,45,.18);
  --text:#151a28;
  --muted:#5d677e;
  --accent:#6d4df6;
  --accent2:#0891b2;
  --accent-soft:rgba(109,77,246,.11);
  --shadow:0 18px 44px rgba(31,41,80,.10);
  --ok:#059669;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Noto Sans",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(700px 480px at 8% -8%, color-mix(in srgb,var(--accent) 26%, transparent), transparent 70%),
    radial-gradient(620px 460px at 98% 8%, color-mix(in srgb,var(--accent2) 17%, transparent), transparent 70%),
    radial-gradient(700px 500px at 60% 108%, color-mix(in srgb,var(--accent) 12%, transparent), transparent 72%);
}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
img{display:block;max-width:100%}
::selection{background:var(--accent);color:#fff}

/* ---------- Layout ---------- */
.wrap{max-width:1260px;margin:0 auto;padding:34px 24px 70px}
.layout{display:grid;grid-template-columns:318px minmax(0,1fr);gap:26px;align-items:start}

/* ---------- Sidebar ---------- */
.sidebar{
  position:sticky;top:26px;
  max-height:calc(100vh - 52px);overflow:auto;
  padding:26px 22px 20px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  scrollbar-width:thin;
}
.sidebar::-webkit-scrollbar{width:5px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:9px}
.avatar-wrap{position:relative;width:96px;height:96px;margin-bottom:16px}
.avatar{
  width:96px;height:96px;border-radius:50%;object-fit:cover;
  border:3px solid var(--panel-2);
  box-shadow:0 0 0 2px var(--border), 0 12px 28px rgba(0,0,0,.25);
}
.avatar-dot{
  position:absolute;right:4px;bottom:6px;width:15px;height:15px;border-radius:50%;
  background:var(--ok);border:3px solid var(--bg);
}
.name{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.25}
.username{margin:4px 0 0;color:var(--accent2);font-size:13.5px;font-weight:600}
.status{
  display:inline-flex;align-items:center;gap:7px;margin-top:14px;
  padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:600;
  background:color-mix(in srgb,var(--ok) 13%,transparent);
  border:1px solid color-mix(in srgb,var(--ok) 28%,transparent);
  color:var(--ok);
}
.status i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.bio{margin:14px 0 0;font-size:13.2px;line-height:1.65;color:var(--muted)}
.location{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:12.5px;color:var(--muted)}

.divider{height:1px;background:var(--border);margin:20px 0}
.side-label{
  display:flex;align-items:center;justify-content:space-between;
  font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--muted);margin:0 2px 11px;
}
.socials{display:flex;flex-direction:column;gap:7px}
.social{
  display:flex;align-items:center;gap:11px;
  padding:9px 11px;border-radius:12px;
  border:1px solid transparent;
  background:var(--panel);
  transition:transform .2s ease,background .2s ease,border-color .2s ease;
}
.social:hover{transform:translateX(3px);background:var(--panel-2);border-color:var(--border)}
.social-ico{
  display:grid;place-items:center;flex:0 0 32px;height:32px;border-radius:10px;
  background:color-mix(in srgb,var(--brand,var(--accent)) 16%,transparent);
  color:var(--brand,var(--accent));
}
.social-name{font-size:13px;font-weight:600;flex:1}
.social-arrow{color:var(--muted);opacity:.65;transition:transform .2s,opacity .2s}
.social:hover .social-arrow{transform:translateX(2px);opacity:1}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:18px}
.stat{padding:11px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--border)}
.stat b{display:block;font-size:19px;line-height:1.1;letter-spacing:-.5px}
.stat span{font-size:10.5px;color:var(--muted);font-weight:600}

.side-actions{display:flex;gap:8px;margin-top:16px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 12px;border-radius:11px;cursor:pointer;
  font-size:12px;font-weight:650;
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  transition:background .2s,border-color .2s,transform .2s;
}
.btn:hover{background:var(--panel-2);border-color:var(--border-strong);transform:translateY(-1px)}
.btn-primary{
  flex:1;background:linear-gradient(120deg,var(--accent),var(--accent2));
  border-color:transparent;color:#fff;
  box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 30%,transparent);
}
.btn-primary:hover{filter:brightness(1.08)}
.btn-icon{flex:0 0 40px;padding:0}

/* ---------- Main ---------- */
.content{min-width:0}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;
  font-size:10.5px;font-weight:800;letter-spacing:2px;text-transform:uppercase;
  color:var(--accent2);margin-bottom:12px;
}
.eyebrow::before{content:"";width:22px;height:2px;border-radius:2px;background:currentColor}
h1{margin:0;font-size:clamp(27px,4vw,38px);font-weight:850;letter-spacing:-1.3px;line-height:1.15}
h1 .grad{background:linear-gradient(100deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{margin:11px 0 0;color:var(--muted);font-size:14px;line-height:1.6;max-width:600px}

.toolbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  margin:26px 0 16px;
}
.search{position:relative;flex:1 1 230px;min-width:190px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{
  width:100%;padding:12px 14px 12px 42px;
  border-radius:13px;border:1px solid var(--border);
  background:var(--panel);color:var(--text);outline:none;
  font-size:13.5px;transition:border-color .2s,box-shadow .2s;
  backdrop-filter:blur(12px);
}
.search input::placeholder{color:var(--muted)}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.count{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.chip{
  padding:7px 13px;border-radius:999px;cursor:pointer;
  font-size:11.8px;font-weight:650;
  border:1px solid var(--border);background:var(--panel);color:var(--muted);
  transition:all .2s;
}
.chip:hover{color:var(--text);border-color:var(--border-strong)}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 5px 16px var(--accent-soft)}
.note{
  display:none;align-items:center;gap:8px;margin:-4px 0 16px;padding:9px 13px;
  border-radius:11px;font-size:12px;color:var(--muted);
  background:var(--panel);border:1px dashed var(--border-strong);
}
.note.show{display:flex}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:16px}
.card{
  display:flex;flex-direction:column;overflow:hidden;
  border-radius:18px;border:1px solid var(--border);
  background:var(--panel);box-shadow:0 10px 30px rgba(0,0,0,.10);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease;
  animation:rise .45s both;animation-delay:calc(var(--i,0)*45ms);
}
.card:hover{transform:translateY(-6px);border-color:var(--border-strong);box-shadow:var(--shadow)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--panel-2)}
.thumb img{width:100%;height:100%;object-fit:cover;transition:transform .45s ease}
.card:hover .thumb img{transform:scale(1.06)}
.thumb::after{content:"";position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.22));pointer-events:none}
.badge{
  position:absolute;top:11px;left:11px;z-index:1;
  display:inline-flex;align-items:center;gap:5px;
  padding:5px 9px;border-radius:999px;font-size:10.5px;font-weight:750;
  color:#fff;background:rgba(10,12,18,.55);border:1px solid rgba(255,255,255,.22);
  backdrop-filter:blur(8px);
}
.badge svg{color:#fbbf24}
.card-body{display:flex;flex-direction:column;flex:1;padding:16px 16px 14px}
.card-title{margin:0;font-size:16px;font-weight:750;letter-spacing:-.3px;line-height:1.3}
.card-desc{
  margin:8px 0 0;font-size:12.7px;line-height:1.62;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:13px}
.tag{padding:4px 9px;border-radius:7px;font-size:10.5px;font-weight:650;color:var(--accent2);background:var(--accent-soft);border:1px solid var(--border)}
.card-foot{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin-top:auto;padding-top:14px;border-top:1px solid var(--border);
}
.domain{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.go{
  display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:50%;
  background:var(--accent-soft);color:var(--accent);
  transition:transform .25s,background .25s,color .25s;
}
.card:hover .go{transform:rotate(-45deg) scale(1.08);background:var(--accent);color:#fff}

.empty{
  grid-column:1/-1;text-align:center;padding:64px 20px;
  border:1px dashed var(--border-strong);border-radius:18px;background:var(--panel);
}
.empty svg{color:var(--muted);opacity:.55;margin-bottom:12px}
.empty b{display:block;font-size:16px}
.empty p{margin:6px 0 0;font-size:13px;color:var(--muted)}

footer{
  margin-top:44px;padding-top:20px;border-top:1px solid var(--border);
  display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;
  font-size:12px;color:var(--muted);
}
footer b{color:var(--text)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);
  z-index:50;padding:11px 18px;border-radius:12px;
  background:var(--panel-2);border:1px solid var(--border-strong);
  box-shadow:var(--shadow);font-size:13px;font-weight:600;
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
  backdrop-filter:blur(14px);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

@media(max-width:920px){
  .wrap{padding:22px 16px 50px}
  .layout{grid-template-columns:1fr;gap:22px}
  .sidebar{position:static;max-height:none}
  .avatar-wrap{width:84px;height:84px}
  .avatar{width:84px;height:84px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
}
@media(max-width:480px){
  .grid{grid-template-columns:1fr}
  .toolbar{gap:8px}
  h1{font-size:28px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="layout">

    <!-- ============ CỘT TRÁI: THÔNG TIN CÁ NHÂN ============ -->
    <aside class="sidebar">
      <div class="avatar-wrap">
        <img class="avatar" id="avatar" alt="Ảnh đại diện">
        <span class="avatar-dot" title="Online"></span>
      </div>
      <h2 class="name" id="name">Đang tải...</h2>
      <p class="username" id="username"></p>
      <div class="status" id="status"><i></i><span></span></div>
      <p class="bio" id="bio"></p>
      <div class="location" id="location"></div>

      <div class="divider"></div>
      <p class="side-label"><span>Kết nối với tôi</span><span id="social-count"></span></p>
      <div class="socials" id="socials"></div>

      <div class="stats">
        <div class="stat"><b id="stat-projects">0</b><span>DỰ ÁN</span></div>
        <div class="stat"><b id="stat-tags">0</b><span>CHỦ ĐỀ</span></div>
      </div>

      <div class="side-actions">

        <button class="btn btn-icon" id="theme-btn" type="button" title="Đổi giao diện sáng/tối" aria-label="Đổi giao diện"></button>
      </div>
    </aside>

    <!-- ============ CỘT PHẢI: DANH SÁCH WEB ============ -->
    <main class="content">
      <div class="eyebrow">My links hub</div>
      <h1>Tất cả <span class="grad">project</span> của tôi</h1>
      <p class="subtitle">Tổng hợp các dự án, tool, web flash...</p>

      <div class="toolbar">
        <label class="search">
          <span class="sr-only">Tìm kiếm dự án</span>
          <span id="search-icon"></span>
          <input id="search" type="search" placeholder="Tìm tên web, mô tả, tag... (nhấn /)" autocomplete="off">

        <span class="count" id="count">0 dự án</span>

      <div class="filters" id="filters"></div>
      <div class="note" id="demo-note"></div>
      <div class="grid" id="grid"></div>

      <footer>
        <span>© <span id="year"></span> <b id="foot-name">My Links</b> · Tổng hợp các website của tôi.</span>
        <span>Built with HTML + <code>link.json</code> · Hosted on GitHub Pages</span>
      </footer>
    </main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

/* ================= HELPERS ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const icon = (n, size = 18) => `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="currentColor" aria-hidden="true">${ICONS[n] || ICONS.globe}</svg>`;
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' })[c]);
const safeUrl = (u) => {
  const s = String(u ?? '').trim();
  if (/^(https?:\/\/|mailto:)/i.test(s)) return s;
  if (/^[\w.-]+\.[a-z]{2,}(\/|$)/i.test(s)) return 'https://' + s;
  return '#';
};
const safeImg = (u) => {
  const s = String(u ?? '').trim();
  if (!s) return '';
  if (/^(https?:\/\/|data:image\/|\/)/i.test(s)) return s;
  if (/^[a-z0-9_\-./]+$/i.test(s) && !s.includes('..')) return s;
  return '';
};
const safeColor = (c) => /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(c ?? '')) ? c : '#7c5cff';
const svgUri = (svg) => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
const domain = (u) => { try { return new URL(safeUrl(u)).hostname.replace(/^www\./, ''); } catch { return 'link'; } };
const initials = (n) => {
  const w = String(n || 'U').trim().split(/\s+/).filter(Boolean);
  if (!w.length) return 'U';
  const s = w.length > 1 ? w[0][0] + w[w.length - 1][0] : w[0][0];
  return s.toUpperCase();
};

const PALETTES = [
  ['#6d5efc','#22d3ee'], ['#0ea5e9','#34d399'], ['#2563eb','#38bdf8'],
  ['#f97316','#ec4899'], ['#8b5cf6','#f472b6'], ['#059669','#84cc16'],
  ['#e11d48','#f59e0b'], ['#0891b2','#6366f1']
];
function coverData(p, i) {
  const [a, b] = PALETTES[i % PALETTES.length];
  const title = esc(String(p.name || 'Dự án').slice(0, 24));
  const dom = esc(domain(p.url));
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient>
<pattern id="p" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.10"/></pattern></defs>
<rect width="800" height="450" fill="url(#g)"/><rect width="800" height="450" fill="url(#p)"/>
<circle cx="680" cy="70" r="160" fill="#ffffff" opacity="0.10"/><circle cx="110" cy="410" r="130" fill="#000000" opacity="0.07"/>
<text x="52" y="90" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="4" fill="#ffffff" opacity="0.82">MY PROJECT</text>
<text x="52" y="248" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#ffffff">${title}</text>
<text x="52" y="292" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff" opacity="0.85">${dom}</text></svg>`;
  return svgUri(svg);
}
function avatarData(name) {
  const t = esc(initials(name));
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
<rect width="320" height="320" rx="160" fill="url(#g)"/><circle cx="240" cy="70" r="90" fill="#ffffff" opacity="0.10"/>
<text x="160" y="208" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="120" font-weight="800" fill="#ffffff">${t}</text></svg>`;
  return svgUri(svg);
}

/* Ảnh lỗi → tự thay bằng ảnh sinh ra */
document.addEventListener('error', (e) => {
  const t = e.target;
  if (t && t.tagName === 'IMG' && t.dataset.fallback && t.src !== t.dataset.fallback) t.src = t.dataset.fallback;
}, true);

/* ================= STATE ================= */
let DATA = FALLBACK;
let activeTag = 'all';
let toastTimer;
const searchEl = $('#search');

function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ================= RENDER SIDEBAR ================= */
function renderProfile() {
  const p = DATA.profile || {};
  const fallbackAv = avatarData(p.name);
  const av = $('#avatar');
  av.dataset.fallback = fallbackAv;
  av.src = safeImg(p.avatar) || fallbackAv;
  av.alt = 'Ảnh đại diện của ' + (p.name || 'tôi');

  $('#name').textContent = p.name || 'Tên của bạn';
  $('#username').textContent = p.username || '';
  $('#bio').textContent = p.bio || '';
  $('#status').querySelector('span').textContent = p.status || 'Online';
  $('#location').innerHTML = p.location ? icon('pin', 14) + '<span>' + esc(p.location) + '</span>' : '';
  $('#foot-name').textContent = p.name || 'My Links';
  document.title = (p.name || 'My Links') + ' — Tổng hợp website';

  const socials = Array.isArray(p.socials) ? p.socials : [];
  $('#social-count').textContent = socials.length + ' links';
  $('#socials').innerHTML = socials.map(s => `
    <a class="social" href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer" style="--brand:${safeColor(s.color)}">
      <span class="social-ico">${icon(s.icon, 18)}</span>
      <span class="social-name">${esc(s.name || 'Liên kết')}</span>
      <span class="social-arrow">${icon('arrow', 16)}</span>
    </a>`).join('');

  const projects = Array.isArray(DATA.projects) ? DATA.projects : [];
  const tags = new Set(projects.flatMap(x => Array.isArray(x.tags) ? x.tags : []));
  $('#stat-projects').textContent = projects.length;
  $('#stat-tags').textContent = tags.size;

  const mail = $('#copy-mail');
  mail.innerHTML = icon('copy', 15) + '<span>Sao chép email</span>';
  mail.onclick = async () => {
    const email = p.email || '';
    if (!email) return toast('Chưa có email trong link.json');
    try {
      await navigator.clipboard.writeText(email);
    } catch {
      const ta = document.createElement('textarea');
      ta.value = email; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
    }
    toast('Đã sao chép: ' + email);
  };

  let themed = null;
  try { themed = localStorage.getItem('links-theme'); } catch {}
  const theme = themed || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = theme;
  updateThemeBtn(theme);
  $('#theme-btn').onclick = () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('links-theme', next); } catch {}
    updateThemeBtn(next);
  };
}
function updateThemeBtn(t) {
  $('#theme-btn').innerHTML = icon(t === 'dark' ? 'sun' : 'moon', 17);
  $('#theme-btn').title = t === 'dark' ? 'Chuyển sang giao diện sáng' : 'Chuyển sang giao diện tối';
}

/* ================= RENDER FILTERS + GRID ================= */
function renderFilters() {
  const projects = Array.isArray(DATA.projects) ? DATA.projects : [];
  const tags = [...new Set(projects.flatMap(x => Array.isArray(x.tags) ? x.tags : []))];
  const box = $('#filters');
  box.innerHTML = ['all', ...tags].map((t, i) =>
    `<button type="button" class="chip${t === activeTag ? ' active' : ''}" data-tag="${esc(t)}">${t === 'all' ? 'Tất cả' : esc(t)}</button>`
  ).join('');
  $$('.chip', box).forEach(btn => btn.onclick = () => {
    activeTag = btn.dataset.tag;
    $$('.chip', box).forEach(c => c.classList.toggle('active', c === btn));
    renderGrid();
  });
}

function card(p, i) {
  const name = String(p.name || 'Dự án');
  const fb = coverData(p, i);
  const img = safeImg(p.image) || fb;
  const tags = (Array.isArray(p.tags) ? p.tags : []).slice(0, 3)
    .map(t => `<span class="tag">${esc(t)}</span>`).join('');
  return `
  <a class="card" href="${esc(safeUrl(p.url))}" target="_blank" rel="noopener noreferrer" style="--i:${i}">
    <div class="thumb">
      <img src="${esc(img)}" alt="Ảnh bìa ${esc(name)}" loading="lazy" data-fallback="${esc(fb)}">
      ${p.featured ? `<span class="badge">${icon('star', 13)} Nổi bật</span>` : ''}
    </div>
    <div class="card-body">
      <h3 class="card-title">${esc(name)}</h3>
      <p class="card-desc">${esc(p.description || '')}</p>
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      <div class="card-foot">
        <span class="domain">${icon('globe', 14)} ${esc(domain(p.url))}</span>
        <span class="go">${icon('external', 15)}</span>
      </div>
    </div>
  </a>`;
}

function renderGrid() {
  const projects = Array.isArray(DATA.projects) ? DATA.projects : [];
  const q = searchEl.value.trim().toLowerCase();
  const list = projects
    .map((p, i) => ({ p, i }))
    .filter(({ p }) => {
      const okTag = activeTag === 'all' || (Array.isArray(p.tags) && p.tags.includes(activeTag));
      const hay = [p.name, p.description, p.url, ...(Array.isArray(p.tags) ? p.tags : [])].join(' ').toLowerCase();
      return okTag && (!q || hay.includes(q));
    });
  $('#count').textContent = list.length + ' dự án';
  $('#grid').innerHTML = list.length
    ? list.map(({ p, i }) => card(p, i)).join('')
    : `<div class="empty">${icon('search', 34)}<b>Không tìm thấy dự án nào</b><p>Thử đổi từ khoá hoặc bấm lại nút “Tất cả”.</p></div>`;
}

/* ================= EVENTS ================= */
$('#search-icon').innerHTML = icon('search', 17);
$('#year').textContent = new Date().getFullYear();
searchEl.addEventListener('input', renderGrid);
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchEl) { e.preventDefault(); searchEl.focus(); }
  if (e.key === 'Escape' && document.activeElement === searchEl) { searchEl.value = ''; renderGrid(); searchEl.blur(); }
});

/* ================= LOAD link.json ================= */
(async function init() {
  let source = 'link.json';
  try {
    const res = await fetch('link.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data || !Array.isArray(data.projects)) throw new Error('Sai cấu trúc JSON');
    DATA = data;
  } catch (err) {
    DATA = FALLBACK;
    source = 'demo';
    const note = $('#demo-note');
    note.innerHTML = icon('mail', 15) + '<span>Đang dùng <b>dữ liệu mẫu</b> — hãy mở qua GitHub Pages hoặc chạy <code>python3 -m http.server</code> để web đọc nội dung từ <code>link.json</code>.</span>';
    note.classList.add('show');
  }
  if (source === 'link.json') {
    document.documentElement.dataset.schema = 'ok';
  }
  renderProfile();
  renderFilters();
  renderGrid();
})();
</script>
